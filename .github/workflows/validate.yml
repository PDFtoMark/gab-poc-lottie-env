name: Validate
on:
  pull_request:
jobs:
  snapshot-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p ./env
          echo PR_NUMBER=${{ github.event.number }} > ./env/env
          echo GITHUB_SHA=${{ github.sha }} >> ./env/env
      - uses: actions/upload-artifact@v4
        with:
          name: env
          path: env/
